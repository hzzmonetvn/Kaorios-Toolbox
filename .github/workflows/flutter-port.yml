name: Flutter Rust port contracts (private source)

# Chạy contracts, tests Java parity và Dart FFI từ repo PRIVATE trên runner PUBLIC.
#
# CẦN SECRET:
#   Public repo → Settings → Secrets and variables → Actions → PRIVATE_REPO_TOKEN

on:
  workflow_dispatch:
    inputs:
      private_branch:
        description: "Nhánh repo private cần kiểm tra"
        required: true
        default: "flutter-port"
      private_ref:
        description: "Commit SHA cụ thể (để trống = HEAD của nhánh trên)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: flutter-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Flutter Rust port contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: private-src

    steps:
      - name: Check PRIVATE_REPO_TOKEN
        working-directory: ${{ github.workspace }}
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Chưa cấu hình secret PRIVATE_REPO_TOKEN."
            exit 1
          fi

      - name: Clone private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: hzzmonetvn/KaoriosToolbox-Frameowrk
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.private_ref != '' && inputs.private_ref || inputs.private_branch }}
          path: private-src
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Native contracts, Java parity and Dart FFI
        run: bash tools/run-port-regressions.sh
