name: Test patcher

on:
  push:
    paths:
      - '.github/workflows/test-patcher.yml'
      - 'script/kaorios_patcher_a17.py'
      - 'script/kaorios_patcher_a17_test.py'
      - 'script/patch-*.py'
      - 'script/verify-*.py'
      - 'script/check-*.py'
      - 'Toolbox-Update/scripts/**'
      - 'Toolbox-data/Pif-props.json'
      - 'Toolbox-data/app-props.json'
      - 'Toolbox-data/device-model.json'
  pull_request:
    paths:
      - '.github/workflows/test-patcher.yml'
      - 'script/kaorios_patcher_a17.py'
      - 'script/kaorios_patcher_a17_test.py'
      - 'script/patch-*.py'
      - 'script/verify-*.py'
      - 'script/check-*.py'
      - 'Toolbox-Update/scripts/**'
      - 'Toolbox-data/Pif-props.json'
      - 'Toolbox-data/app-props.json'
      - 'Toolbox-data/device-model.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check all Python scripts
        run: |
          python -m py_compile script/kaorios_patcher_a17.py
          for f in script/patch-*.py script/verify-*.py script/check-*.py; do
            [ -f "$f" ] && python -m py_compile "$f"
          done

      - name: Syntax check shell scripts
        run: |
          for f in script/*.sh Toolbox-Update/scripts/*.sh; do
            [ -f "$f" ] && bash -n "$f"
          done

      - name: Validate Toolbox-data JSON
        run: |
          for f in Toolbox-data/*.json; do
            [ -f "$f" ] && python -m json.tool "$f" > /dev/null
          done
          python script/validate_toolbox_data.py Toolbox-data

      - name: Run PIF updater unit tests
        run: bash Toolbox-Update/scripts/update_pif_test.sh

      - name: Run patcher unit tests
        run: python -m unittest discover -s script -p 'kaorios_patcher_a17_test.py' -v

      - name: Run services patcher tests
        run: python script/patch-services-a17-test.py -v

      - name: Run settings provider patcher tests
        run: python script/patch-settingsprovider-a17-test.py -v

      - name: Run SELinux policy tests
        run: python script/check-advanced-policy-sepolicy-test.py -v

      - name: Run framework sample checker and tests
        run: |
          python script/check-framework-samples-test.py -v
          python script/check-framework-samples.py
