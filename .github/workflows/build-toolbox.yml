name: Build Toolbox (private source)

# Build app Toolbox từ source repo PRIVATE (hzzmonetvn/KaoriosToolbox-Frameowrk).
#
# CẦN THÊM SECRET TRƯỚC KHI CHẠY (tự nhập):
#   Public repo → Settings → Secrets and variables → Actions
#   → New repository secret:
#     Name : PRIVATE_REPO_TOKEN
#     Value: GitHub Personal Access Token có quyền ĐỌC repo private
#            - Classic PAT: tick scope `repo`
#            - Hoặc Fine-grained PAT: Repository access = Only select repositories
#              → chọn KaoriosToolbox-Frameowrk, quyền Contents = Read-only
#
# Chạy: Actions → Build Toolbox (private source) → Run workflow
#       → chọn nhánh repo private cần build (mặc định: flutter-port).

on:
  workflow_dispatch:
    inputs:
      private_branch:
        description: "Nhánh repo private cần build"
        required: true
        default: "flutter-port"
      private_ref:
        description: "Commit SHA cụ thể (để trống = HEAD của nhánh trên)"
        required: false
        default: ""

permissions:
  contents: read

env:
  ANDROID_ALL_VERSION: 17-robolectric-15733970
  ANDROID_ALL_SHA256: f6a41ad548bb45cccd3b1d4774cb50d57826dd319b6e5accd6b6269876e12d71

concurrency:
  group: build-toolbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Flutter APK + Rust + framework DEX
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: private-src

    steps:
      - name: Check PRIVATE_REPO_TOKEN
        # Chạy TRƯỚC khi clone nên phải override working-directory mặc định.
        working-directory: ${{ github.workspace }}
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Chưa cấu hình secret PRIVATE_REPO_TOKEN. Vào repo Settings → Secrets and variables → Actions → New repository secret (xem chú thích đầu file)."
            exit 1
          fi

      - name: Clone private source
        uses: actions/checkout@v6
        with:
          repository: hzzmonetvn/KaoriosToolbox-Frameowrk
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.private_ref != '' && inputs.private_ref || inputs.private_branch }}
          path: private-src
          fetch-depth: 1

      - name: Show checked out commit
        run: |
          git log --oneline -1
          git status --short | head -5 || true

      - name: Set up Java 21 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Cache cargo registry + target dir của Rust crate → lần build sau
      # không phải biên dịch lại reqwest/tokio/prost/...
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: private-src/flutter_app/rust
          cache-on-failure: true

      # Cache binary cargo-ndk + codegen (cargo install biên dịch lại từ source rất lâu).
      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-v1-${{ runner.os }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Install protoc
        run: command -v protoc >/dev/null || (sudo apt-get update && sudo apt-get install -y protobuf-compiler)

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore merged android.jar cache
        id: cache-merged-jar
        uses: actions/cache@v4
        with:
          path: ~/merged-android-cache/android-37-merged.jar
          key: android-merged-37-${{ env.ANDROID_ALL_VERSION }}-${{ runner.os }}

      - name: Install Android SDK 37, NDK and CMake
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"
          [ -d "$ANDROID_SDK_ROOT/platforms/android-37" ] || \
            ln -sfn android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Install full AOSP API 37 compile stubs
        shell: bash
        run: |
          public_android="$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          core_modules="$ANDROID_SDK_ROOT/platforms/android-37.0/core-for-system-modules.jar"
          cached_jar="$HOME/merged-android-cache/android-37-merged.jar"

          if [ -f "$cached_jar" ]; then
            echo "Cache hit — dùng merged android.jar có sẵn, bỏ qua download ~1GB."
            test -f "$public_android"
            install -m 0644 "$cached_jar" "$public_android"
          else
            echo "Cache miss — download + merge AOSP stubs (chỉ chậm lần đầu)."
            android_all="$RUNNER_TEMP/android-all-${ANDROID_ALL_VERSION}.jar"
            merged_dir="$RUNNER_TEMP/android-api-37-merged"
            merged_android="$RUNNER_TEMP/android-api-37-merged.jar"

            curl --fail --location --retry 3 \
              --output "$android_all" \
              "https://repo.maven.apache.org/maven2/org/robolectric/android-all/${ANDROID_ALL_VERSION}/android-all-${ANDROID_ALL_VERSION}.jar"
            echo "${ANDROID_ALL_SHA256}  ${android_all}" | sha256sum --check --strict
            unzip -tq "$android_all"

            test -f "$public_android"
            test -f "$core_modules"
            mkdir -p "$merged_dir"
            unzip -q "$public_android" -d "$merged_dir"
            unzip -oq "$core_modules" -d "$merged_dir"
            unzip -oq "$android_all" -d "$merged_dir"
            jar --create --file "$merged_android" --no-manifest -C "$merged_dir" .

            mkdir -p "$HOME/merged-android-cache"
            cp "$merged_android" "$cached_jar"
            install -m 0644 "$merged_android" "$public_android"
          fi

          unzip -Z1 "$public_android" > "$RUNNER_TEMP/android-api-37-merged.entries"
          grep -Fx "java/lang/Object.class" "$RUNNER_TEMP/android-api-37-merged.entries"
          grep -Fx "android/app/ActivityThread.class" "$RUNNER_TEMP/android-api-37-merged.entries"
          grep -Fx "android/hardware/security/keymint/KeyParameter.class" "$RUNNER_TEMP/android-api-37-merged.entries"
          unzip -tq "$public_android"

      - name: Add Kaorios framework API to compile boot classpath
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :framework:compileReleaseJavaWithJavac \
            --no-daemon \
            --stacktrace

          public_android="$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          framework_classes="framework/build/intermediates/javac/release/compileReleaseJavaWithJavac/classes"
          api_dir="$RUNNER_TEMP/kaorios-framework-boot-api"
          api_package="$api_dir/com/kousei/framework"

          test -f "$public_android"
          test -f "$framework_classes/com/kousei/framework/KaoriosFramework.class"
          mkdir -p "$api_package"
          find "$framework_classes/com/kousei/framework" \
            -maxdepth 1 \
            -type f \
            -name 'KaoriosFramework*.class' \
            -exec cp {} "$api_package/" \;

          jar --update --file "$public_android" -C "$api_dir" .
          unzip -Z1 "$public_android" > "$RUNNER_TEMP/android-api-37-with-kaorios.entries"
          grep -Fx "com/kousei/framework/KaoriosFramework.class" \
            "$RUNNER_TEMP/android-api-37-with-kaorios.entries"
          unzip -tq "$public_android"

      - name: Build framework release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :framework:assembleRelease --no-daemon --stacktrace

      - name: Flutter pub get + codegen l10n
        shell: bash
        run: |
          cd flutter_app
          flutter pub get
          flutter gen-l10n

      - name: flutter_rust_bridge codegen
        shell: bash
        run: |
          command -v flutter_rust_bridge_codegen >/dev/null || cargo install flutter_rust_bridge_codegen --locked
          flutter_rust_bridge_codegen --version
          cd flutter_app
          flutter_rust_bridge_codegen generate
          # Codegen ghi đè rust/src/frb_generated.rs + sinh Dart bindings.

      - name: Build Rust core (aarch64-linux-android)
        shell: bash
        run: |
          cd flutter_app/rust
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release
          test -f ../android/app/src/main/jniLibs/arm64-v8a/libkaorios_core.so

      - name: Build Flutter release APK
        shell: bash
        run: |
          cd flutter_app
          echo "flutter.sdk=$(which flutter | xargs dirname | xargs dirname)" > android/local.properties
          flutter build apk --release --target-platform android-arm64

      - name: Sign Flutter APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$unsigned_apk"

          aligned_apk="$RUNNER_TEMP/KaoriosToolbox-aligned.apk"
          signed_apk="$RUNNER_TEMP/KaoriosToolbox-release.apk"

          "$ANDROID_SDK_ROOT/build-tools/37.0.0/zipalign" \
            -P 16 -f 4 "$unsigned_apk" "$aligned_apk"

          # Keystore + keystore.properties nằm sẵn trong repo private (KeySign/).
          properties="KeySign/keystore.properties"
          read_property() {
            sed -n "s/^${1}=//p" "$properties" | tail -n 1 | tr -d '\r'
          }
          store_file="$(read_property storeFile)"
          key_alias="$(read_property keyAlias)"
          export KAORIOS_STORE_PASSWORD="$(read_property storePassword)"
          export KAORIOS_KEY_PASSWORD="$(read_property keyPassword)"
          test -n "$store_file"
          test -n "$key_alias"

          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" sign \
            --ks "KeySign/$store_file" \
            --ks-key-alias "$key_alias" \
            --ks-pass env:KAORIOS_STORE_PASSWORD \
            --key-pass env:KAORIOS_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify \
            --verbose "$signed_apk"
          install -m 0644 "$signed_apk" "$unsigned_apk"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          app_apk="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          framework_apk="$(find framework/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"

          test -f "$app_apk"
          test -n "$framework_apk"
          unzip -tq "$app_apk"
          unzip -tq "$framework_apk"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify "$app_apk"

          rust_lib_entry="lib/arm64-v8a/libkaorios_core.so"
          rust_count="$(unzip -Z1 "$app_apk" | grep -Fxc "$rust_lib_entry" || true)"
          if [[ "$rust_count" != "1" ]]; then
            echo "::error::APK thiếu ${rust_lib_entry}"
            exit 1
          fi

          mkdir -p dist
          cp "$app_apk" dist/KaoriosToolbox-release.apk
          cp "$framework_apk" dist/KaoriosFramework-release.apk
          unzip -p "$framework_apk" classes.dex > dist/classes.dex

          mkdir -p dist/lib/arm64-v8a
          unzip -p "$app_apk" "$rust_lib_entry" \
            > dist/lib/arm64-v8a/libkaorios_core.so

          test -s dist/classes.dex
          test -s dist/lib/arm64-v8a/libkaorios_core.so

          sha256sum \
            dist/KaoriosToolbox-release.apk \
            dist/KaoriosFramework-release.apk \
            dist/classes.dex \
            dist/lib/arm64-v8a/libkaorios_core.so \
            > dist/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KaoriosToolbox-flutter-${{ github.run_number }}
          path: private-src/dist/
          if-no-files-found: error
          retention-days: 14
