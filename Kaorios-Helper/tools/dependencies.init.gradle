// Export exact runtime coordinates, POMs and source archives beside public sources.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    rootProject.allprojects { project ->
        project.tasks.register('helperDependencySources') {
            doLast {
                def runtime = project.configurations.findByName('releaseRuntimeClasspath')
                if (runtime == null || !runtime.canBeResolved) {
                    throw new GradleException("No release runtime configuration in ${project.path}")
                }
                def dest = new File(rootProject.projectDir, 'helper-dependencies')
                dest.mkdirs()
                def report = []
                runtime.incoming.resolutionResult.allComponents.each { component ->
                    def id = component.id
                    if (id instanceof ModuleComponentIdentifier) {
                        def coordinate = "${id.group}:${id.module}:${id.version}"
                        if (!report.contains(coordinate)) {
                            report.add(coordinate)
                            ['@pom', ':sources@jar'].each { suffix ->
                                def configuration = project.configurations.detachedConfiguration(
                                    project.dependencies.create(coordinate + suffix))
                                configuration.transitive = false
                                configuration.resolvedConfiguration.lenientConfiguration.artifacts.each { source ->
                                    project.copy {
                                        from(source.file)
                                        into(new File(dest, "${id.group}/${id.module}/${id.version}"))
                                    }
                                }
                            }
                        }
                    }
                }
                new File(dest, project.name + '-runtime.txt').text = report.unique().sort().join('\n') + '\n'
            }
        }
    }
}
